<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 270" role="img" aria-labelledby="alcance-por-seguidor-t" class="chart">
  <title id="alcance-por-seguidor-t">Quantos seguidores veem cada post. Taxa média de alcance no Instagram em 2026</title>
  <style>
  .surface{fill:#ffffff}.t1{fill:#0b0b0b}.t2{fill:#52514e}.t3{fill:#77766f}.grid{stroke:#e6e5e0}.base{stroke:#c9c8c1}.bar{fill:#5B3DF5}.bar-soft{fill:#5B3DF5;opacity:.45}
  text{font-family:Inter,system-ui,sans-serif}
  @media (prefers-color-scheme: dark){.surface{fill:#1a1a19}.t1{fill:#f0efec}.t2{fill:#c3c2b7}.t3{fill:#9d9c94}.grid{stroke:#383835}.base{stroke:#55544f}.bar{fill:#8a74ff}.bar-soft{fill:#8a74ff;opacity:.5}}</style>
  <rect width="680" height="270" class="surface"/>
  
  <text x="24" y="38" class="t1" font-size="19" font-weight="700">Quantos seguidores veem cada post</text>
  <text x="24" y="62" class="t2" font-size="14">Taxa média de alcance no Instagram em 2026</text><g class="mark" data-tip="O estudo traz valores entre 3,2% e 4,9% dependendo do recorte">
      <rect x="24" y="92" width="308" height="140" rx="10" class="grid" fill="none" stroke-width="1"/>
      <rect x="44" y="114" width="28" height="6" rx="3" class="bar"/>
      <text x="44" y="174" class="t1" font-size="48" font-weight="800">3 a 5</text>
      <text x="44" y="200" class="t2" font-size="13.5">de cada 100 seguidores são</text><text x="44" y="217" class="t2" font-size="13.5">alcançados por um post, em média</text>
    </g><g class="mark" data-tip="Complemento da taxa de alcance">
      <rect x="348" y="92" width="308" height="140" rx="10" class="grid" fill="none" stroke-width="1"/>
      <rect x="368" y="114" width="28" height="6" rx="3" class="bar"/>
      <text x="368" y="174" class="t1" font-size="48" font-weight="800">95+</text>
      <text x="368" y="200" class="t2" font-size="13.5">de cada 100 seguidores não veem</text><text x="368" y="217" class="t2" font-size="13.5">aquele post</text>
    </g><text x="24" y="254" class="t3" font-size="11.5">Fonte: Socialinsider, estudo de alcance 2026 (alcance dividido por seguidores)</text>
</svg>