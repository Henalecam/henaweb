      <path d="M250,152H525Q529,152 529,156V170Q529,174 525,174H250Z" class="bar-soft"/>
      <text x="537" y="169" class="t1" font-size="16" font-weight="700">31%</text>
    </g><text x="24" y="240" class="t3" font-size="11.5">Fonte: Metricool, 2026 Social Media Study (39,7 milhões de posts, 1 milhão de contas)</text>
